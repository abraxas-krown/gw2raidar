# The frontend service (docker-compose.yml): serves the page shell and the static files, and passes
# everything else (the JSON API, downloads, the admin, Django's own pages) to the Django service `web`.
# Traefik (Dokploy) sends the site's traffic here; `web` is not reachable from outside.
#
# The page locations below must match the URLs raidar/static/raidar/router.js reads pages from.

# Traefik terminates HTTPS and says so in X-Forwarded-Proto; pass that on (Django's SECURE_PROXY_SSL_HEADER
# trusts it). Without Traefik in front, it is this server's own scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# static files with a content hash in their name (script.55ba567ba476.js) never change
map $uri $static_cache_control {
    "~\.[0-9a-f]{12}\.[A-Za-z0-9]+$"  "public, max-age=31536000, immutable";
    default                            "public, max-age=3600";
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # log uploads (upload.json, api/upload.json); Django sets no limit of its own
    client_max_body_size 200m;

    # Docker's DNS; `web` is looked up per request (through the variable below), so a recreated `web`
    # container with a new address is found, and nginx starts even before `web` is up
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $django http://web:8000;

    # ---- the page shell: the same file for every page URL; the app reads the page from the URL ----
    root /usr/share/nginx/html;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
    }
    location ~ ^/(encounters|leaderboards|profile|uploads|account|register|login|index|reset_pw|thank-you|info-(help|releasenotes|contact|about|framework))(/\w+)?$ {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
    }
    location ~ ^/encounter/\w+$ {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
    }
    # nginx matches the decoded path, so /global_stats/All%20raid%20bosses is "All raid bosses" here;
    # the .json data URLs do not match and go to Django
    location ~ "^/(api/)?global_stats(/[0-9]+)?(/(area-)?([0-9]+|[A-Za-z ]+))?$" {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
    }

    # ---- static files, as collected by collectstatic (hashed copies and their .gz versions) ----
    # /static/raidar/script.js is /usr/share/nginx/static/raidar/script.js
    location ^~ /static/ {
        root /usr/share/nginx;
        gzip_static on;
        add_header Cache-Control $static_cache_control always;
    }

    # ---- everything else is Django's ----
    location / {
        proxy_pass $django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # gunicorn's timeout (docker/gunicorn.conf.py); uploads are parsed later, by the worker
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
