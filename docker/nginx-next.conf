# The frontend-next image (Dockerfile target `frontend-next`): serves the new frontend built from
# frontend-next/ (Rsbuild: the page shell, its bundles under /app/, and the images under /assets/), and passes
# everything else (the JSON API, downloads, the admin and its /static/ files, Django's own pages) to the Django
# service `web`. It is docker/nginx.conf with the /app/ location added; keep the two in step.
#
# The page locations below must match the URLs frontend-next/src/routes.tsx has pages for (the same as
# frontend/assets/router.js).

# Traefik terminates HTTPS and says so in X-Forwarded-Proto; pass that on (Django's SECURE_PROXY_SSL_HEADER
# trusts it). Without Traefik in front, it is this server's own scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # log uploads (upload.json, api/upload.json); Django sets no limit of its own
    client_max_body_size 200m;

    # Docker's DNS; `web` is looked up per request (through the variable below), so a recreated `web`
    # container with a new address is found, and nginx starts even before `web` is up
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $django http://web:8000;

    # compresses the shell and the bundles, and the API's JSON on its way through
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    charset utf-8;
    charset_types text/html text/css application/javascript;

    # ---- the page shell: the same file for every page URL; the app reads the page from the URL ----
    root /usr/share/nginx/html;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
    }
    location ~ ^/(encounters|leaderboards|profile|uploads|account|register|login|reset_pw|info-(help|releasenotes|contact|about|framework|api))(/\w+)?$ {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
    }
    location ~ ^/encounter/\w+$ {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
    }
    # nginx matches the decoded path, so /global_stats/All%20raid%20bosses is "All raid bosses" here;
    # the .json data URLs do not match and go to Django
    location ~ "^/(api/)?global_stats(/[0-9]+)?(/(area-)?([0-9]+|[A-Za-z ]+))?$" {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
    }

    # ---- the app's bundles (JS, CSS, fonts): every file name has a content hash, so they never change ----
    location ^~ /app/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ---- the images (public/assets/img), at the URLs the backend hands out (raidar/assets.py) ----
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # ---- everything else is Django's, /static/ (the admin's files, served by WhiteNoise) included ----
    location / {
        proxy_pass $django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # gunicorn's timeout (docker/gunicorn.conf.py); uploads are parsed later, by the worker
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
