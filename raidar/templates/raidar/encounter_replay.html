{% load static %}
{# The map, its controls and the timeline are drawn by RaidarReplay.Viewer (replay.js); the panel on the right shows its state (replay.view) #}
<div class="r-replay uk-margin-top" x-replay-viewer="page.no" data-static="{% static 'raidar/img/' %}">
  <div class="r-replay-stage">
    {# the viewer adds its canvas to .r-replay-map; the page's messages are kept out of it #}
    <div class="r-replay-map"></div>
    <template x-if="replay.loading">
      <div class="r-replay-message"><span uk-spinner></span> Loading the replay&hellip;</div>
    </template>
    <template x-if="!replay.loading && replay.error">
      <div class="r-replay-message">The replay could not be loaded.</div>
    </template>
    <div class="r-replay-controls"></div>
    <div class="r-replay-timeline"></div>
  </div>

  <div class="r-replay-side">
    <template x-if="replay.view.bosses.length">
      <div class="r-replay-group">
        <div class="r-replay-section-head">
          <h6 class="r-replay-group-title uk-font-family-secondary uk-text-uppercase" x-text="replay.view.bosses.length > 1 ? 'Bosses' : 'Boss'"></h6>
          {# their own Boons and Condis toggles (replay_show.bosses) #}
          <div class="r-replay-toggles">
            <button type="button" class="uk-button uk-button-default uk-button-small r-replay-toggle" :class="{'uk-active': replay_show.bosses.boons}"
                    :title="(replay_show.bosses.boons ? 'Hide' : 'Show') + ' boons and buffs'" @click="toggle('replay_show.bosses.boons')">Boons</button>
            <button type="button" class="uk-button uk-button-default uk-button-small r-replay-toggle" :class="{'uk-active': replay_show.bosses.conditions}"
                    :title="(replay_show.bosses.conditions ? 'Hide' : 'Show') + ' conditions'" @click="toggle('replay_show.bosses.conditions')">Condis</button>
          </div>
        </div>
        <template x-for="unit in replay.view.bosses">
          {% include 'raidar/encounter_replay_target.html' %}
        </template>
      </div>
    </template>
    <template x-if="replay.view.parties.length">
      <div class="r-replay-section-head">
        <h6 class="r-replay-group-title uk-font-family-secondary uk-text-uppercase">Players</h6>
        {# the DPS, Boons and Condis toggles (replay_show) #}
        <div class="r-replay-toggles">
          <button type="button" class="uk-button uk-button-default uk-button-small r-replay-toggle" :class="{'uk-active': replay_show.players.dps}"
                  :title="(replay_show.players.dps ? 'Hide' : 'Show') + ' boss and total DPS'" @click="toggle('replay_show.players.dps')">DPS</button>
          <button type="button" class="uk-button uk-button-default uk-button-small r-replay-toggle" :class="{'uk-active': replay_show.players.boons}"
                  :title="(replay_show.players.boons ? 'Hide' : 'Show') + ' boons and buffs'" @click="toggle('replay_show.players.boons')">Boons</button>
          <button type="button" class="uk-button uk-button-default uk-button-small r-replay-toggle" :class="{'uk-active': replay_show.players.conditions}"
                  :title="(replay_show.players.conditions ? 'Hide' : 'Show') + ' conditions'" @click="toggle('replay_show.players.conditions')">Condis</button>
        </div>
      </div>
    </template>
    <template x-for="group in replay.view.parties">
      <div class="r-replay-group">
        <h6 class="r-replay-group-title uk-font-family-secondary uk-text-uppercase">
          <span class="r-replay-swatch" :style="'background-color: ' + group.colour"></span><span x-text="'Party ' + group.party"></span>
        </h6>
        <template x-for="player in group.players">
          <div class="r-replay-unit" :class="'r-replay-' + player.state + (player.selected ? ' r-replay-selected' : '')" @click="replaySelect(player.index)">
            <template x-if="player.spec">
              <img class="r-replay-spec" :src="'{% static 'raidar/img/48px/' %}' + player.spec + '_tango_icon_48px.png'" :alt="player.spec" :title="player.spec">
            </template>
            <div class="r-replay-unit-body">
              <div class="r-replay-unit-line">
                <template x-if="player.private">
                  <span class="private" data-text="PRIVATE">PRIVATE</span>
                </template>
                <template x-if="!player.private">
                  <span class="r-replay-unit-name uk-text-truncate"><template x-if="player.commander">{% include 'raidar/commander_tag.html' %}</template> <span x-text="player.name"></span></span>
                </template>
                <span class="r-replay-unit-value" x-text="player.state == 'dead' ? 'Dead' : player.state == 'down' ? 'Downed' : player.state == 'dc' ? 'Disconnected' : round(player.health) + '%'">
                </span>
              </div>
              <div class="r-replay-bar" :title="'Health ' + round(player.health) + '%' + (player.barrier ? ', barrier ' + round(player.barrier) + '%' : '')">
                {# health, then barrier after it; with more barrier than missing health, the two share the bar #}
                <div class="r-replay-bar-fill" :style="'width: ' + player.bar.health + '%'"></div>
                <template x-if="player.barrier">
                  <div class="r-replay-bar-barrier" :style="'left: ' + player.bar.health + '%; width: ' + player.bar.barrier + '%'"></div>
                </template>
              </div>
              <template x-if="replay_show.players.dps">
                {# boss DPS, and total DPS behind it, so far in the fight; the squad's highest total fills the bar #}
                <div class="r-replay-dps" :title="'Boss DPS ' + num(player.dps.boss, 0) + ', total DPS ' + num(player.dps.total, 0)">
                  <div class="r-replay-dps-total" :style="'width: ' + player.dps.totalWidth + '%'"></div>
                  <div class="r-replay-dps-boss" :style="'width: ' + player.dps.bossWidth + '%'"></div>
                  <span class="r-replay-dps-text" x-text="player.dps.text"></span>
                </div>
              </template>
              <template x-if="replay_show.players.boons">
                <div class="r-replay-buffs">{% include 'raidar/encounter_replay_buffs.html' with list='player.buffs' %}</div>
              </template>
              <template x-if="replay_show.players.conditions">
                <div class="r-replay-buffs r-replay-conditions">{% include 'raidar/encounter_replay_buffs.html' with list='player.conditions' %}</div>
              </template>
            </div>
          </div>
        </template>
      </div>
    </template>

    <template x-if="replay.view.adds.length">
      <div class="r-replay-group">
        <div class="r-replay-section-head">
          <h6 class="r-replay-group-title uk-font-family-secondary uk-text-uppercase">Targets</h6>
          {# their own Boons and Condis toggles (replay_show.targets) #}
          <div class="r-replay-toggles">
            <button type="button" class="uk-button uk-button-default uk-button-small r-replay-toggle" :class="{'uk-active': replay_show.targets.boons}"
                    :title="(replay_show.targets.boons ? 'Hide' : 'Show') + ' boons and buffs'" @click="toggle('replay_show.targets.boons')">Boons</button>
            <button type="button" class="uk-button uk-button-default uk-button-small r-replay-toggle" :class="{'uk-active': replay_show.targets.conditions}"
                    :title="(replay_show.targets.conditions ? 'Hide' : 'Show') + ' conditions'" @click="toggle('replay_show.targets.conditions')">Condis</button>
          </div>
        </div>
        <template x-for="unit in replay.view.adds">
          {% include 'raidar/encounter_replay_target.html' %}
        </template>
      </div>
    </template>
  </div>
</div>
