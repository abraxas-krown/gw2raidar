{% load static %}

<template x-if="global_stats">
  <div id="content" x-with="global_stats" x-with:stats="stats">
      {# Mobile navigation/filtering #}
      <h6 class="uk-font-family-secondary uk-hidden@s uk-margin-top">Encounter Filter</h6>
      <select class="uk-select uk-hidden@m uk-margin-bottom" x-uk-update id="area-selector" x-select-model="page.stats_page"
              @change="fire('global_stats_nav', $event, 'page.stats_page', page.stats_page)"
              x-html="optionsHtml(data.boss_locations.flatMap(loc => [].concat(
                loc.all ? [{value: loc.all, label: loc.all}] : [],
                loc.wings.map(wing => ({group: wing.name, options: wing.bosses.map(boss => ({value: boss, label: areaLabel(boss)}))}))
              )))">
      </select>
    <!-- Era Filter -->
    <div class="uk-flex-left uk-visible@m " uk-grid>
      <div class="uk-width-expand  uk-margin-bottom uk-margin-top">
        <div class="uk-width-1-1 boundary">
          <div class="uk-button-group ">
              {# <button class="uk-button">All (45)</button> #}
              {# a button for each kind of boss, then the dropdowns they open (UIkit's toggle option), so that the group's first and last buttons stay the first and last of their kind #}
              <template x-for="(loc, locIndex) in data.boss_locations">
                {# TODO active check is bad ATM #}
                <button class="uk-button uk-inline" :id="'global-stats-kind-' + locIndex" :class="{'uk-button-primary': page.stats_page == loc.all || page.stats_page in loc.bosses}"><span x-visible="page.stats_page == loc.all || page.stats_page in loc.bosses" x-text="(data.areas[page.stats_page] ? areaLabel(page.stats_page) : page.stats_page) + ' &mdash;&nbsp;'"></span><span x-text="loc.name"></span> <i class="material-icons">expand_more</i></button>
              </template>
              <template x-for="(loc, locIndex) in data.boss_locations">
                  <div :uk-dropdown="'mode: click; boundary: .boundary; boundary-align: true; pos: bottom-justify; toggle: #global-stats-kind-' + locIndex">
                    <div class="uk-width-1 uk-grid">
                      <template x-if="loc.all">
                      <div class="uk-width-1">
                        <ul class="uk-nav uk-dropdown-nav">
                          <li :class="{'uk-active': page.stats_page === loc.all}">
                            <a @click.prevent.stop="fire('global_stats_nav', $event, 'page.stats_page', loc.all)" :href="getPageURL({name: 'global_stats', stats_page: loc.all})" x-text="loc.all"></a>
                          </li>
                        </ul>
                    </div>
                      </template>
                      <template x-for="wing in loc.wings">
                        <div class="uk-width-1" :class="'uk-width-1-' + loc.columns + '@m'">
                          <ul class="uk-nav uk-dropdown-nav">
                            <li class="uk-nav-header uk-margin-top" x-text="wing.name"></li>
                            <template x-for="boss in wing.bosses">
                              <li :class="{'uk-active': page.stats_page == boss}"><a @click="($event.ctrlKey || $event.metaKey) || (fire('global_stats_nav', $event, 'page.stats_page', boss), $event.preventDefault(), $event.stopPropagation())" :href="getPageURL({name: 'global_stats', stats_page: boss})" x-text="areaLabel(boss)"></a></li>
                            </template>
                          </ul>
                        </div>
                      </template>
                    </div>
                  </div>
              </template>
            </div>
        </div>
      </div>

      <div class="uk-text-right">
        <h6 class="uk-font-family-secondary uk-text-uppercase">Compare Percentile</h6>
        <template x-for="perc_option in [99, 90, 80, 70, 60, 50, 30]">
          <span>
            <input class="uk-checkbox r-percentile-checkbox" type="checkbox" :id="perc_option + 'check'" :checked="settings.compareGlobalPerc.indexOf(perc_option) !== -1" @click="set('settings.compareGlobalPerc', updateCompareGlobalPerc(settings.compareGlobalPerc, perc_option))">
            <label class="r-percentile-label uk-text-bold" :for="perc_option + 'check'"><span class="uk-badge" :class="'r-bg-' + perc_option" x-text="perc(perc_option, 0)"></span></label>
          </span>
        </template>
      </div>
    </div>
    <div class="uk-width-auto">
      <h6 class="uk-font-family-secondary uk-text-uppercase">Time Frame</h6>
      <button class="uk-button uk-width-auto@m uk-width-1-1 uk-margin-right@l" type="button"><span x-text="page.era_id ? eras[page.era_id].name : 'Most recent'"></span><i class="material-icons">expand_more</i></button>
      <div uk-dropdown="mode: click">
          <ul class="uk-nav uk-dropdown-nav">
            <template x-for="era in era_order">
              <li><a @click="fire('global_stats_nav', $event, 'page.era_id', era.id)" x-text="era.name"></a></li>
            </template>
          </ul>
      </div>
    </div>

  <div class="uk-clearfix">
  </div>
      <!-- <p><strong>Disclaimer: The statistics displayed in this report are based off data available within GW2Raidar only, as such it is not a complete representation of the Guild Wars 2 raiding community. Efforts are made to ensure accuracy, however some anomalies may exist. Only successful runs are included and builds with fewer than 10 data points are not shown.</strong></p> -->


      <!-- Grid CSS experiement -->
      <h2 class="uk-heading-line"><span>Full Group</span></h2>
      <div class="r-global-stats-container r-global-group-stats-container squad">
        <div class="r-stats-row r-stats-header uk-visible@l">
          <div>Duration</div>
          <div>DPS</div>
          <div>DPS Recieved</div>
        </div>
        <div class="r-stats-row">
          <template x-if="group.per_duration">
          <div class="r-duration" x-with="{duration_percentiles: p(group.per_duration)}">
            <h6 class="uk-font-family-secondary uk-margin-small-bottom uk-text-uppercase uk-hidden@l">Duration</h6>
              <template x-for="perc_option in settings.compareGlobalPerc">
                <div class="r-duration-item" :class="'r-bg-' + perc_option" x-text="formatTimeShort(duration_percentiles[100 - perc_option])">
                </div>
              </template>
          </div>
          </template>
          <template x-if="group.per_duration">
          <div class="r-global-stats-damage">
            <h6 class="uk-font-family-secondary uk-margin-remove-bottom uk-text-uppercase uk-hidden@l">Damage Per Second</h6>
            <svg class="chart" xmlns='http://www.w3.org/2000/svg' :height="(24 + settings.compareGlobalPerc.length * 12) + 'px'" xml:space="preserve" preserveAspectRatio="xMinYMax meet"
                 x-with="{dps_percentiles: p(group.per_dps), boss_dps_percentiles: p(group.per_dps_boss)}">
              {% comment %}
              Overlapping charts for Boss and Cleave damage

              First <rect> is the "cleave" damage which as a slight opactity drop to the color. Each are positioned exactly at the same X,Y values but different dynamic widths based on data.
              Second <rect> is full opacity and the same color.

              Classes assign colors: r-bg-{Percentile} will add the color to that element.
              {% endcomment %}
              <template x-for="(perc_option, index) in settings.compareGlobalPerc">
                <g>
                  <rect class="chart chart-hover" :class="'r-bg-' + perc_option" uk-tooltip="pos: bottom-left; delay: 350" :title="`<h5 class='uk-font-family-secondary uk-text-uppercase uk-margin-remove-bottom'>Total | ${perc_option}th Percentile</h6>${num(dps_percentiles[perc_option], 0)} Damage Per Second`" x='0%' :y="(14 + index * 12) + 'px'" height='8px' :width="(100 * dps_percentiles[perc_option] / group.max_dps) + '%'" opacity='0.3' />
                  <rect class="chart chart-hover" :class="'r-bg-' + perc_option" uk-tooltip="pos: bottom-left; delay: 350" :title="`<h5 class='uk-font-family-secondary uk-text-uppercase uk-margin-remove-bottom'>Boss | ${perc_option}th Percentile</h6>${num(boss_dps_percentiles[perc_option], 0)} Damage Per Second`" x='0%' :y="(14 + index * 12) + 'px'" height='8px' :width="(100 * boss_dps_percentiles[perc_option] / group.max_dps) + '%'"/>
                  <template x-if="index == 0">
                    <text xml:space="preserve" :x="(100 * dps_percentiles[perc_option] / group.max_dps) + '%'" :y="(10 + index * 12) + 'px'" dominant-baseline="baseline" text-anchor="end" font-family='Source Sans Pro' fill='#FCF1E2'  font-size='11' x-text="'(' + num(boss_dps_percentiles[perc_option], 0) + ') ' + num(dps_percentiles[perc_option], 0)"></text>
                  </template>
                  <template x-if="index != 0 && index < settings.compareGlobalPerc.length - 1">
                    <text xml:space="preserve" :x="((100 * dps_percentiles[perc_option] / group.max_dps) + 0.5) + '%'" :y="(18 + index * 12) + 'px'" dominant-baseline="middle" text-anchor="start" font-family='Source Sans Pro' fill='#FCF1E2'  font-size='11' x-text="'(' + num(boss_dps_percentiles[perc_option], 0) + ') ' + num(dps_percentiles[perc_option], 0)"></text>
                  </template>
                  <template x-if="index != 0 && index >= settings.compareGlobalPerc.length - 1">
                     <text xml:space="preserve" :x="(100 * dps_percentiles[perc_option] / group.max_dps) + '%'" :y="(24 + index * 12) + 'px'" dominant-baseline="hanging" text-anchor="end" font-family='Source Sans Pro' fill='#FCF1E2'  font-size='11' x-text="'(' + num(boss_dps_percentiles[perc_option], 0) + ') ' + num(dps_percentiles[perc_option], 0)"></text>
                  </template>
                </g>
              </template>
            </svg>
          </div>
          </template>
          <template x-if="group.per_duration">
          <div class="r-global-stats-damageIn">
            <h6 class="uk-font-family-secondary uk-margin-small-bottom uk-text-uppercase uk-hidden@l">DPS Recieved</h6>
            <svg class="chart" xmlns='http://www.w3.org/2000/svg' :height="(24 + settings.compareGlobalPerc.length * 12) + 'px'" width="100%" preserveAspectRatio="xMinYMax meet"
                 x-with="{inc_dps_percentiles: p(group.per_dps_received)}">
              <template x-for="(perc_option, index) in settings.compareGlobalPerc">
                <g>
                  <rect class="chart chart-hover" :class="'r-bg-' + perc_option" uk-tooltip="pos: bottom-left; delay: 350" :title="`<h5 class='uk-font-family-secondary uk-text-uppercase uk-margin-remove-bottom'>Received | ${perc_option}th Percentile</h6>${num(inc_dps_percentiles[100 - perc_option], 0)} Damage Per Second`" x='0%' :y="(14 + index * 12) + 'px'" height='8px' :width="(100 * inc_dps_percentiles[100 - perc_option] / group.max_dps_received) + '%'"/>
                  <template x-if="index == 0">
                    <text :x="(100 * inc_dps_percentiles[100 - perc_option] / group.max_dps_received) + '%'" :y="(10 + index * 12) + 'px'" dominant-baseline="baseline" text-anchor="end" font-family='Source Sans Pro' fill='#FCF1E2'  font-size='11' x-text="num(inc_dps_percentiles[100 - perc_option], 0)"></text>
                  </template>
                  <template x-if="index != 0 && index < settings.compareGlobalPerc.length - 1">
                    <text :x="((100 * inc_dps_percentiles[100 - perc_option] / group.max_dps_received) + 1) + '%'" :y="(18 + index * 12) + 'px'" dominant-baseline="middle" text-anchor="start" font-family='Source Sans Pro' fill='#FCF1E2'  font-size='11' x-text="num(inc_dps_percentiles[100 - perc_option], 0)"></text>
                  </template>
                  <template x-if="index != 0 && index >= settings.compareGlobalPerc.length - 1">
                     <text :x="(100 * inc_dps_percentiles[100 - perc_option] / group.max_dps_received) + '%'" :y="(24 + index * 12) + 'px'" dominant-baseline="hanging" text-anchor="end" font-family='Source Sans Pro' fill='#FCF1E2'  font-size='11' x-text="num(inc_dps_percentiles[100 - perc_option], 0)"></text>
                  </template>
                </g>
              </template>
            </svg>
          </div>
          </template>
          <template x-if="!group.per_duration">
            <div class='r-global-stats-damage'>Not enough data to display for group statistics</div>
          </template>
        </div>
      </div>

      <template x-for="arch in [{archetype: 1}, {archetype: 2}, {archetype: 5}]">
      <div x-with="arch">
      <h2 class="uk-heading-line"><span x-text="data.archetypes[archetype]"></span></h2>

      <div class="r-global-stats-container">
        <div class="r-stats-row r-stats-header uk-visible@l">
          <div></div>
          <div>Damage Per Second</div>
          <div>Buffs</div>
        </div>

        <template x-for="stat in flattenStats(build)">
            <template x-if="stat.professionId != 'All' && stat.eliteId != 'All' && stat.archetypeId == archetype">
                <div class="r-stats-row"
                     x-with="stat"
                     x-with:line="{lineStats: build[professionId][eliteId][archetypeId]}"
                     x-with:buffs="{buffs: highestBuffs(build[professionId][eliteId][archetypeId].buffs_out)}">
                  <div class='r-spec'>
                    <div>
                      <h6 class="uk-font-family-secondary uk-text-uppercase uk-margin-remove" x-text="data.specialisations[professionId][0]"></h6>
                      <template x-if="!(Number(page.stats_page) > 0)">
                      <h5 class="uk-margin-remove r-tooltip-help" uk-tooltip="pos: bottom-left; delay: 350" :title="`<h5 class='uk-font-family-secondary uk-text-uppercase uk-margin-remove-bottom'>Medium Confidence Level</h6> Statistics that combine multiple encounters may be heavily skewed by the fact that different classes are used at different bosses, regardless of sample size (${lineStats.count})`"><i class="material-icons uk-text-warning uk-text-small r-global-stats-indicator">info</i>&nbsp;<span x-text="data.specialisations[professionId][eliteId]"></span></h5>
                      </template>
                      <template x-if="Number(page.stats_page) > 0 && lineStats.count >= 200">
                      <h5 class="uk-margin-remove r-tooltip-help" uk-tooltip="pos: bottom-left; delay: 350" :title="`<h5 class='uk-font-family-secondary uk-text-uppercase uk-margin-remove-bottom'>High Confidence Level</h6> This indicates a large sample size (${lineStats.count}) and the statistics shown should be an accurate representation.`"><i class="material-icons uk-text-success uk-text-small r-global-stats-indicator">stars</i>&nbsp;<span x-text="data.specialisations[professionId][eliteId]"></span></h5>
                      </template>
                      <template x-if="Number(page.stats_page) > 0 && lineStats.count < 200 && lineStats.count >= 50">
                      <h5 class="uk-margin-remove r-tooltip-help" uk-tooltip="pos: bottom-left; delay: 350" :title="`<h5 class='uk-font-family-secondary uk-text-uppercase uk-margin-remove-bottom'>Medium Confidence Level</h6> This indicates a moderate sample size (${lineStats.count}) and the statistics are probably a good representation but could contain some outliers that are skewing numbers up or down.`"><i class="material-icons uk-text-warning uk-text-small r-global-stats-indicator">info</i>&nbsp;<span x-text="data.specialisations[professionId][eliteId]"></span></h5>
                      </template>
                      <template x-if="Number(page.stats_page) > 0 && !(lineStats.count >= 50)">
                      <h5 class="uk-margin-remove r-tooltip-help" uk-tooltip="pos: bottom-left; delay: 350" :title="`<h5 class='uk-font-family-secondary uk-text-uppercase uk-margin-remove-bottom'>Low Confidence Level</h6> This indicates a small sample size (${lineStats.count}) there is enough data to be shown (more than 10 logs) but it's probably heavily skewed by outliers.`"><i class="material-icons uk-text-danger uk-text-small r-global-stats-indicator">cancel</i>&nbsp;<span x-text="data.specialisations[professionId][eliteId]"></span></h5>
                      </template>
                    </div>
                    <img :alt="data.specialisations[professionId][eliteId]" :src="'/static/raidar/img/48px/' + data.specialisations[professionId][eliteId] + '_tango_icon_48px.png'">
                  </div>
                  <div class="r-global-stats-damage">
                    <h6 class="uk-font-family-secondary uk-margin-remove-bottom uk-text-uppercase uk-hidden@l">Damage Per Second</h6>
                    <svg class="chart" xmlns='http://www.w3.org/2000/svg' :height="(24 + settings.compareGlobalPerc.length * 12) + 'px'" preserveAspectRatio="xMinYMax meet"
                         x-with="{dps_percentiles: p(lineStats.per_dps)}">
                      {% comment %}
                      Overlapping charts for Boss and Cleave damage

                      First <rect> is the "cleave" damage which as a slight opactity drop to the color. Each are positioned exactly at the same X,Y values but different dynamic widths based on data.
                      Second <rect> is full opacity and the same color.

                      Classes assign colors: r-bg-{Percentile} will add the color to that element.

                      The text has some custom adjustments to deal with alignment issues.
                      {% endcomment %}
                      <template x-for="(perc_option, index) in settings.compareGlobalPerc">
                        <g>
                          <rect class="chart chart-hover" :class="'r-bg-' + perc_option" uk-tooltip="pos: bottom-left; delay: 350" :title="`<h5 class='uk-font-family-secondary uk-text-uppercase uk-margin-remove-bottom'>Total | ${perc_option}th Percentile</h6>${num(dps_percentiles[perc_option], 0)} Damage Per Second`" x='0%' :y="(14 + index * 12) + 'px'" height='8px' :width="(100 * dps_percentiles[perc_option] / individual.max_dps) + '%'" opacity='0.3' />
                          <rect class="chart chart-hover" :class="'r-bg-' + perc_option" uk-tooltip="pos: bottom-left; delay: 350" :title="`<h5 class='uk-font-family-secondary uk-text-uppercase uk-margin-remove-bottom'>Boss | ${perc_option}th Percentile</h6>${num(boss_dps_percentiles[perc_option], 0)} Damage Per Second`" x='0%' :y="(14 + index * 12) + 'px'" height='8px' :width="(100 * boss_dps_percentiles[perc_option] / individual.max_dps) + '%'"/>
                          <template x-if="index == 0">
                          <text :x="(100 * dps_percentiles[perc_option] / individual.max_dps) + '%'" :y="(10 + index * 12) + 'px'" dominant-baseline="baseline" :text-anchor="(100 * dps_percentiles[perc_option] / individual.max_dps) < 25 ? 'begin' : 'end'" font-family='Source Sans Pro' fill='#FCF1E2'  font-size='11' x-text="'(' + num(boss_dps_percentiles[perc_option], 0) + ') ' + num(dps_percentiles[perc_option], 0)"></text>
                          </template>
                          <template x-if="index != 0 && index < settings.compareGlobalPerc.length - 1">
                          <text :x="((100 * dps_percentiles[perc_option] / individual.max_dps) + 0.5) + '%'" :y="(19 + index * 12) + 'px'" dominant-baseline="middle" text-anchor="start" font-family='Source Sans Pro' fill='#FCF1E2'  font-size='11' x-text="'(' + num(boss_dps_percentiles[perc_option], 0) + ') ' + num(dps_percentiles[perc_option], 0)"></text>
                          </template>
                          <template x-if="index != 0 && index >= settings.compareGlobalPerc.length - 1">
                          <text :x="(100 * dps_percentiles[perc_option] / individual.max_dps) + '%'" :y="(24 + index * 12) + 'px'" dominant-baseline="hanging" :text-anchor="(100 * dps_percentiles[perc_option] / individual.max_dps) < 25 ? 'begin' : 'end'" font-family='Source Sans Pro' fill='#FCF1E2'  font-size='11' x-text="'(' + num(boss_dps_percentiles[perc_option], 0) + ') ' + num(dps_percentiles[perc_option], 0)"></text>
                          </template>
                        </g>
                      </template>
                    </svg>
                  </div>
                  <div class="r-global-stats-buffs r-buff-container">
                    <h6 class="uk-font-family-secondary uk-text-uppercase uk-hidden@l uk-margin-remove">Buffs</h6>
                    <template x-for="buff in [
                      buffs[0],
                      buffs[1],
                      buffs[2] ,
                      buffs[3],
                      buffs[4]
                    ]">
                    <div class="r-buff" x-with="buff" x-with:names="{stackable: buff_name == 'might', pretty_name: buff_name.replace('_',' ')}">
                      <template x-if="percentiles">
                      <div class="r-buff-icon">
                        <img :src="'{% static 'raidar/img/buff/' %}/' + buff_name + '.png'" :alt="buff_name" width="20">
                      </div>
                      </template>
                      <template x-for="perc_option in (percentiles ? settings.compareGlobalPerc : [])">
                        <div uk-tooltip="pos: bottom-left; delay: 350" :title="stackable
                               ? `<h5 class='uk-font-family-secondary uk-text-uppercase uk-margin-remove-bottom'>${pretty_name} Stacks | ${perc_option}th Percentile</h6>Average output of ${num(percentiles[perc_option], 0)} stacks of ${pretty_name}`
                               : `<h5 class='uk-font-family-secondary uk-text-uppercase uk-margin-remove-bottom'>${pretty_name} Uptime | ${perc_option}th Percentile</h6>Average output of ${num(percentiles[perc_option], 0)}% ${pretty_name} uptime`"
                             class="r-buff-number chart-hover" :class="'r-bg-' + perc_option"><span x-text="num(percentiles[perc_option], 0)"></span><sup x-visible="!stackable">%</sup>
                        </div>
                      </template>
                    </div>
                    </template>
                  </div>
                </div>
            </template>
        </template>
        <template x-if="!flattenStats(build).length">
          <div class="r-stats-row">
            <div class='r-global-stats-damage' x-text="'Not enough data to display for ' + data.archetypes[archetype] + ' specialisations'"></div>
          </div>
        </template>
      </div>
      </div>
      </template>
  </div>
</template>
