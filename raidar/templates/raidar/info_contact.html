<h2>Contact</h2>

<p>Use the form below to send us an email, alternatively you can reach us via our <a href="http://discord.gg/8j43kAc">Discord</a></p>

<form class="uk-form-stacked uk-padding-large uk-text-center">
  <template x-if="!username">
    <div class="uk-margin">
      <input class="uk-input uk-form-width-medium" x-model="contact.input.name" required placeholder="Your name"/>
    </div>
  </template>
  <template x-if="!username">
    <div class="uk-margin">
      <input class="uk-input uk-form-width-medium" x-model="contact.input.email" required placeholder="Your email"/>
    </div>
  </template>
  <div class="uk-margin">
    <input class="uk-input uk-form-width-1-1" x-model="contact.input.subject" required placeholder="Subject"/>
  </div>
  <div class="uk-margin">
    <textarea class="uk-textarea uk-form-width-1-1" rows="10" placeholder="Email text" required x-model="contact.input.body"></textarea>
  </div>
  <div class="uk-margin">
    <button class="uk-button uk-button-primary" @click="fire('contact_us', $event)">Contact us!</button><br>
  </div>
</form>
