{% load static %}
<div class="uk-grid uk-grid-item-match">
  {# Mobile navigation/filtering #}
  <h6 class="uk-font-family-secondary uk-hidden@s uk-margin-bottom">Encounter Filter</h6>
  <div class="uk-button-group uk-flex-wrap uk-width-1-1 uk-width-auto@s">
      <template x-for="kind_id in [0, 1, 2]">
        <button class="uk-button uk-inline" :class="{'uk-button-primary': page.leaderboards.kind == kind_id}" @click="set('page.leaderboards.kind', kind_id); fire('leaderboards_nav', $event)" x-text="data.boss_locations[kind_id].name"></button>
      </template>
  </div>

  <div class="r-toggle uk-font-family-secondary uk-text-small uk-text-uppercase uk-width-auto@s uk-margin-small-top uk-margin-small-bottom">
     <div uk-form-custom="target: > * > span.era">
         <select x-select-model="page.era" @change="fire('leaderboards_nav', $event)">
           <option value="null" default>This Era</option>
           <option disabled>──────────</option>
           <template x-for="era in leaderboards.eras">
             <option :value="JSON.stringify(era.id)" x-text="era.name"></option>
           </template>
         </select>
         <span>
           <span class="uk-active era"></span> <i class="material-icons">keyboard_arrow_down</i>
         </span>
     </div>
     |
     <div uk-form-custom="target: > * > span.time">
         <select x-select-model="page.leaderboards.week">
             <template x-for="week in leaderboards.weeks">
               <option :value="JSON.stringify(week)" x-text="week == 'Era' ? week : formatDate(week, true)"></option>
             </template>
         </select>
         <span>
             <span class="uk-active">Fastest Kills</span> <span class="uk-active time"></span> <i class="material-icons">keyboard_arrow_down</i>
         </span>
     </div>
  </div>

</div>


  <template x-for="wing in data.boss_locations[page.leaderboards.kind].wings">
  <div class="r-leaderboard-wing">
    <h4 class="uk-font-family-secondary r-leaderboard-heading uk-margin-remove uk-text-uppercase" x-text="wing.name"></h4>
    <template x-for="boss in wing.bosses">
        <div class="r-leaderboard-encounter" x-with="{leaderboard: leaderboards[boss].periods[page.leaderboards.week], max_max_dps: leaderboards[boss].max_max_dps}" :class="{expanded: boss == page.leaderboards.boss}" @click="set('page.leaderboards.boss', boss)">
          <img :src="'/static/raidar/img/icon/' + data.areas[boss].icon + '.png'" :alt="data.areas[boss].name" width="50px" onerror="this.style.visibility='hidden'">
          <h2 class="uk-margin-remove-top uk-text-truncate "><span x-text="data.areas[boss].name"></span> <span x-visible="data.areas[boss].tag" class="uk-label" :class="'r-mode-' + data.areas[boss].tag" x-text="data.areas[boss].tag"></span></h2>
          <a class="uk-h3 uk-margin-remove" :class="{'uk-invisible': boss != page.leaderboards.boss}" @click.prevent.stop="set('page.leaderboards.boss', null)"><i class="material-icons">close</i></a>
          <template x-for="(line, index) in leaderboard">
            <a class="r-leaderboard-row" :href="getPageURL({ name: 'encounter', no: line.url_id })" @click="($event.ctrlKey || $event.metaKey) || (setPage({ name: 'encounter', no: line.url_id }), $event.preventDefault(), $event.stopPropagation())">
              <div class="r-rank uk-text-center uk-text-middle uk-h2 uk-margin-remove-bottom" x-text="index + 1">
              </div>
              <div class="r-time">
                <h3 class="uk-margin-remove-bottom" x-text="formatTime(line.duration)"></h3>
                <div class="r-remaining uk-font-family-secondary uk-text-truncate">
                  <span x-text="formatTime(data.areas[boss].enrage - line.duration) + ' remaining'"></span>
                  <span x-visible="line.tags">&middot;</span>
                  <span x-text="line.tags"></span>
                </div>
              </div>

              <div class="r-damage">
                <svg class="chart" width="100%" xmlns='http://www.w3.org/2000/svg' height="29px" xml:space="preserve" preserveAspectRatio="xMinYMax meet">
                  {# Same as our other rect graphs #}
                  <rect class="chart total r-bg-101"  x='0' y='3px' height='24px' :width="(100 * line.dps / max_max_dps) + '%'" opacity='0.3' />
                  <rect class="chart boss r-bg-101" x='0' y='3px' height='24px' :width="(100 * line.dps_boss / max_max_dps) + '%'"/>

                  {# Encounter DPS (Boss) Total like it is on Global Stats #}

                </svg>
                <span class="uk-font-family-secondary" x-text="'(' + num(line.dps_boss, 0) + ') ' + num(line.dps, 0) + ' DPS'"></span>
              </div>
              <div class="r-buffs">
                <template x-for="buff in ['might', 'fury', 'quickness', 'alacrity']">
                    <div class="r-buff" x-with="{name: data.buffs[buff].name, format: data.buffs[buff].stacks ? num : perc, icon: data.buffs[buff].icon}">
                      <div class="r-buff-icon">
                        <img :src="icon" :alt="name" width="20">
                      </div>
                      <div class="r-buff-number r-bg-101" x-text="format(line.buffs[buff], 2)"></div>
                    </div>
                </template>
              </div>
              <div class="r-composition">
                <template x-for="member in line.comp">
                    <img :alt="data.archetypes[member[0]] + ' ' + data.specialisations[member[1]][member[2]]" :src="'/static/raidar/img/48px/' + data.specialisations[member[1]][member[2]] + '_tango_icon_48px.png'">
                </template>
              </div>
            </a>
          </template>
        </div>
    </template>
    </div>
  </template>
