{% load static %}
<div class="table-container uk-margin-top">
  {% include 'raidar/encounter_row_header.html' %}
  <div class="r-encounter-stats-container r-encounter-mechanics-container uk-margin-remove-bottom uk-background-default" style="z-index: 980;" uk-sticky="bottom: #offset">
    <div class="r-stats-row r-stats-header uk-visible@l">
      <div>Totals</div>
      <template x-for="metric in encounter.boss_metrics">
        <div class="r-mechanics-list" uk-tooltip="pos:bottom-center" :title="metric.long_name" x-text="metric.short_name">
        </div>
      </template>

    </div>
  </div>
  <div class="r-encounter-stats-container r-encounter-mechanics-container squad">
    <div class="r-stats-row">
      <div class="r-encounter-player uk-text-right"><h5 class="uk-margin-remove">Squad</h5></div>
      <template x-for="metric in encounter.boss_metrics">
        <div class="r-mechanics-list">
          <h6 class="uk-hidden@l" x-text="metric.short_name"></h6>
          <span x-text="encounter.phases[page.phase].mechanics[metric.name]"></span>
        </div>
      </template>
    </div>
  </div>

  <template x-for="(party, partyNo) in encounter.phases[page.phase].parties">
    <div class="r-encounter-stats-container r-encounter-mechanics-container">

        <div class="r-stats-row r-party">
          <div class="r-encounter-player uk-text-right">
            <div>
              <h5 class="uk-margin-remove" x-text="'Party ' + partyNo"></h5>
              <h6 class="uk-font-family-secondary uk-text-muted uk-margin-remove uk-text-uppercase" x-text="party.members.length + ' member' + (party.members.length > 1 ? 's' : '')"></h6>
            </div>
          </div>
          <template x-for="metric in encounter.boss_metrics">
            <div class="r-mechanics-list">
              <h6 class="uk-hidden@l" x-text="metric.short_name"></h6>
              <span x-text="party.mechanics[metric.name]"></span>
            </div>
          </template>
        </div>

      <template x-for="member in party.members">
          <div class="r-stats-row r-member" :class="'activity-' + num(activity(member.events), 0)">
            <div class="r-encounter-player uk-text-right" :class="{'compare-show': member.self}" uk-tooltip="pos: bottom-left; delay: 350" :title="`${member.name ? `${member.name}</br><strong>Account:</strong> ${member.account}` : 'ACCOUNT PRIVATE'}<br><strong>Activity:</strong> ${perc(activity(member.events), 0)}<br>
              Deaths: ${member.events.dead_count}${member.events.dead_count ? ` (${formatTime(member.events.dead_time / 1000)})` : ''}<br>
              Downs: ${member.events.down_count}${member.events.down_count ? ` (${formatTime(member.events.down_time / 1000)})` : ''}<br>
              Disconnects: ${member.events.disconnect_count}${member.events.disconnect_count ? ` (${formatTime(member.events.disconnect_time / 1000)})` : ''}`">
              <div class="uk-text-truncate">
                <h6 class="uk-font-family-secondary uk-text-muted uk-margin-remove uk-text-uppercase" x-text="data.archetypes[member.archetype]"></h6>
                <template x-if="member.name">
                  <h5 class="uk-margin-remove uk-text-truncate"><template x-if="member.commander">{% include 'raidar/commander_tag.html' %}</template> <span x-text="member.name"></span></h5>
                </template>
                <template x-if="!member.name">
                  <h5 class="private uk-margin-remove" data-text="PRIVATE">PRIVATE</h5>
                </template>
              </div>
              <div class="r-encounter-player-image">
                <img :alt="data.specialisations[member.profession][member.elite]" :src="'{% static 'raidar/img/48px/' %}/' + data.specialisations[member.profession][member.elite] + '_tango_icon_48px.png'"/>
                <img class="r-encounter-player-archetype" :alt="data.archetypes[member.archetype]" :src="'{% static 'raidar/img/arch/' %}/' + data.archetypes[member.archetype] + '.png'"/>
              </div>
            </div>
            <template x-for="metric in encounter.boss_metrics">
              <div class="r-mechanics-list">
                <h6 class="uk-hidden@l" x-text="metric.short_name"></h6>
                <span x-text="member.mechanics[metric.name]"></span>
              </div>
            </template>
          </div>
      </template>
    </div>
  </template>
</div>
