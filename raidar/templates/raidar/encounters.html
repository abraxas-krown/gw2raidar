{% load static %}
<div class="table-container">
<button class="uk-button" @click="fire('encounter_filter_toggle', $event)"><span x-text="settings.encounterSort.filters ? 'Show' : 'Hide'"></span> Filters <i class="material-icons">filter_list</i></button>
<template x-if="settings.encounterSort.filter.any">
  <button class="uk-button" @click="fire('encounter_filter_clear', $event)">Clear Filters <i class="material-icons">close</i></button>
</template>
  <div uk-grid>
    <template x-if="!settings.encounterSort.filters">
    <div class="uk-width-1-4@m uk-width-1-1">
      <form class="uk-form-stacked uk-margin-top">
        <legend class="uk-h6 uk-font-family-secondary uk-text-uppercase uk-text-light">Filters</legend>

            <div class="uk-margin">
              <label class="uk-form-label uk-h5 uk-invisible-access">By Success</label>
              <div class="uk-button-group uk-form-controls">
                <button class="uk-button uk-button-default uk-button-small" :class="{'uk-button-primary': settings.encounterSort.filter.success === true}" value="true" @click="fire('encounter_filter_success', $event)"><i class="material-icons uk-text-success">check_circle</i> Success</button>
                <button class="uk-button uk-button-default uk-button-small" :class="{'uk-button-primary': settings.encounterSort.filter.success === false}" value="false" @click="fire('encounter_filter_success', $event)"><i class="material-icons uk-text-danger">cancel</i> Wipe</button>
                <button class="uk-button uk-button-default uk-button-small" :class="{'uk-button-primary': settings.encounterSort.filter.success === null}" value="null" @click="fire('encounter_filter_success', $event)">All</button>
              </div>
            </div>

            <div class="uk-margin">
              <label class="uk-form-label uk-h5 uk-invisible-access">By Mode</label>
              <div class="uk-button-group uk-form-controls">
                <button class="uk-button uk-button-default uk-button-small" :class="{'uk-button-primary': settings.encounterSort.filter.mode === 0}" value="0" @click="fire('encounter_filter_mode', $event)">Normal</button>
                <button class="uk-button uk-button-default uk-button-small" :class="{'uk-button-primary': settings.encounterSort.filter.mode === 1}" value="1" @click="fire('encounter_filter_mode', $event)" uk-tooltip title="Challenge mode">CM</button>
                <button class="uk-button uk-button-default uk-button-small" :class="{'uk-button-primary': settings.encounterSort.filter.mode === 2}" value="2" @click="fire('encounter_filter_mode', $event)" uk-tooltip title="Legendary challenge mode">LCM</button>
                <button class="uk-button uk-button-default uk-button-small" :class="{'uk-button-primary': settings.encounterSort.filter.mode == null}" value="null" @click="fire('encounter_filter_mode', $event)">All</button>
              </div>
            </div>

            <div class="uk-margin">
              <label class="uk-form-label uk-h5 uk-invisible-access" for="encounterSelect">By Encounter</label>
              <div class="uk-form-controls">
                <select id="encounterSelect" class="uk-select" x-select-model="settings.encounterSort.filter.area">
                  <option value="null">-- Show all encounters --</option>
                  <template x-for="area in encountersAreas">
                    <option :value="JSON.stringify(area)" x-text="area"></option>
                  </template>
                </select>
              </div>
            </div>
            <div class="uk-margin">
              <label for="#characterName" class="uk-form-label uk-h5 uk-invisible-access">By Character</label>
              <div class="uk-form-controls">
                <select id="characterSelect" class="uk-select" x-select-model="settings.encounterSort.filter.character">
                  <option value="null">-- Show all characters --</option>
                  <template x-for="character in encountersCharacters">
                    <option :value="JSON.stringify(character)" x-text="character"></option>
                  </template>
                </select>
              </div>
            </div>

            <div class="uk-margin">
              <label for="#accountName" class="uk-form-label uk-h5 uk-invisible-access">By Account</label>
              <div class="uk-form-controls">
                <select id="accountSelect" class="uk-select" x-select-model="settings.encounterSort.filter.account">
                  <option value="null">-- Show all accounts --</option>
                  <template x-for="account in encountersAccounts">
                    <option :value="JSON.stringify(account)" x-text="account"></option>
                  </template>
                </select>
              </div>
            </div>
            <div :class="{'uk-hidden': !moreFilters}">
              <div class="uk-margin">
                <label for="" class="uk-form-label uk-h5">By Encounter Duration</label>
                <div uk-grid>
                  <div class="uk-width-1-2">
                    <input class="uk-input" x-model="settings.encounterSort.filter.duration_from" placeholder="Longer than...">
                  </div>
                  <div class="uk-width-1-2">
                    <input class="uk-input" x-model="settings.encounterSort.filter.duration_till" placeholder="Shorter than...">
                  </div>
                </div>
              </div>
              <div class="uk-margin">
                <label for="" class="uk-form-label uk-h5">By Encounter Time</label>
                <div uk-grid>
                  <div class="uk-width-1-2">
                    <label for="timeFrom" class="uk-form-label">From</label>
                    <input class="uk-input" x-model="settings.encounterSort.filter.started_from" placeholder="From" type="date" id="timeFrom">
                  </div>
                  <div class="uk-width-1-2">
                    <label for="timeTill" class="uk-form-label">Till</label>
                    <input class="uk-input" x-model="settings.encounterSort.filter.started_till" placeholder="Till" type="date" id="timeTill">
                  </div>
                </div>
              </div>
              <div class="uk-margin">
                <label for="" class="uk-form-label uk-h5">By Uploaded Time</label>
                <div uk-grid>
                  <div class="uk-width-1-2">
                    <label for="timeFrom" class="uk-form-label">From</label>
                    <input class="uk-input" x-model="settings.encounterSort.filter.uploaded_from" placeholder="From" type="date" id="timeFrom">
                  </div>
                  <div class="uk-width-1-2">
                    <label for="timeTill" class="uk-form-label">Till</label>
                    <input class="uk-input" x-model="settings.encounterSort.filter.uploaded_till" placeholder="Till" type="date" id="timeTill">
                  </div>
                </div>
              </div>
              <div class="uk-margin">
                <label for="#category" class="uk-form-label uk-h5">By Category</label>
                <select id="category" x-uk-update class="uk-select uk-margin-remove" x-select-model="settings.encounterSort.filter.category">
                  <option value="null">-- no filter --</option>
                  <option value="0">-- uncategorised --</option>
                  <template x-for="(category, id) in data.categories">
                    <option :value="JSON.stringify(parseInt(id))" x-text="category"></option>
                  </template>
                </select>
              </div>

              <div class="uk-margin">
                <label for="#tag" class="uk-form-label uk-h5">By Tag</label>
                <input placeholder="Tag search" class="uk-input" id="tag" x-model="settings.encounterSort.filter.tag">
              </div>
            </div>
            <a class="uk-visible@s" @click="toggle('moreFilters')" x-text="(moreFilters ? 'Less' : 'More') + ' Filters'"></a>
      </form>

    </div>
    </template>
    <div class="uk-width-expand">
      <table  class="uk-table uk-table-striped uk-table-small uk-table-responsive encounters">
        <thead>
          <tr>
            {# a column's sort arrow: up or down where the list is sorted by it, a dash elsewhere #}
            <template x-for="column in [
              {prop: 'area', sort: 'area:up', title: 'Encounter', th: 'uk-width-small uk-visible@l'},
              {prop: 'started_at', sort: 'started_at:down', title: 'Time', th: 'uk-width-small'},
              {prop: 'duration', sort: 'duration:down', title: 'Dur.', th: 'uk-width-small'},
              {prop: 'character', sort: 'character:up', title: 'Character', th: 'uk-width-small'},
              {prop: 'account', sort: 'account:up', title: 'Account', th: 'uk-width-small'},
              {prop: 'uploaded_at', sort: 'uploaded_at:down', title: 'Upload', th: 'uk-width-small'},
              {prop: 'category', sort: 'category:up', title: 'Category', th: 'uk-width-small'}
            ]">
              <th :class="column.th" @click="fire('sort_encounters', $event)" :data-sort="column.sort">
                <span><span x-text="column.title"></span>
                <span x-visible="settings.encounterSort.prop != column.prop">-</span>
                <i x-visible="settings.encounterSort.prop == column.prop" class="material-icons" style="font-size: 16px; vertical-align: text-bottom;" x-text="settings.encounterSort.dir == 'up' ? 'keyboard_arrow_up' : 'keyboard_arrow_down'"></i></span>
              </th>
            </template>
          </tr>


        </thead>

        {# each row is a link to the encounter: a click opens it here, ctrl/cmd or the middle button in a new tab #}
        <template x-for="row in encounterSlice" :key="row.id">
          <tr class="r-encounters-list" role="link" tabindex="0" style="cursor: pointer"
              @click="($event.ctrlKey || $event.metaKey) ? window.open(getPageURL({ name: 'encounter', no: row.url_id }), '_blank') : setPage({ name: 'encounter', no: row.url_id })"
              @auxclick="$event.button == 1 && window.open(getPageURL({ name: 'encounter', no: row.url_id }), '_blank')"
              @keydown.enter="setPage({ name: 'encounter', no: row.url_id })">
            <td colspan="3">
              <h4 class="uk-margin-remove"><span x-text="row.area"></span> <span x-visible="row.mode_tag" class="uk-label" :class="'r-mode-' + row.mode_tag" x-text="row.mode_tag"></span></h4>
              <span class="uk-badge uk-text-bold" :class="row.success ? 'uk-label-success' : 'uk-label-danger'" x-text="(row.success ? 'Success' : 'Wipe') + '  (' + formatTime(row.duration) + ')'"></span>
              <span class="uk-badge uk-text-bold r-bg-0" x-text="formatDate(row.started_at)"></span>
                <template x-for="tag in row.tags">
                  <span class="tag uk-badge uk-text-bold" style="margin-right:2px;" x-text="tag"></span>
                </template>
            </td>
            <td colspan="2">
                <div class="max-content-width">
                  <p class="uk-margin-remove"><img :alt="data.archetypes[row.archetype]" :src="'{% static 'raidar/img/arch/' %}/' + data.archetypes[row.archetype] + '.png'"/>
                  <img :alt="data.specialisations[row.profession][row.elite]" :src="'{% static 'raidar/img/20px/' %}/' + data.specialisations[row.profession][row.elite] + '_tango_icon_20px.png'"/><span x-text="row.character"></span></p>
                  <p class="uk-text-small uk-margin-remove">Account: <span x-text="row.account"></span></p>
                </div>
            </td>
            <td class="uk-visible@m" x-text="formatDate(row.uploaded_at)">
            </td>
            <td class="uk-visible@m" x-text="row.category ? data.categories[row.category] : ''">
            </td>
          </tr>
        </template>
      </table>
    </div>
  </div>
</div>

<ul class="uk-pagination uk-flex-center">
  <template x-for="pageLink in encounterPages">
    <li :class="pageLink.a ? 'uk-active' : pageLink.d ? 'uk-disabled' : ''">
      <span x-visible="pageLink.a || pageLink.d" :class="pageLink.c" x-text="pageLink.t"></span>
      <a x-visible="!(pageLink.a || pageLink.d)" href="#" :class="pageLink.c" :data-page="pageLink.n || pageLink.t" @click="fire('page_no', $event)" x-text="pageLink.t"></a>
    </li>
  </template>
</ul>
