# Builds the two images of the Dockerfile (`app` and `frontend`) on pushes to develop, feature/* and
# release tags (v*), and publishes them to GHCR:
#   ghcr.io/abraxas-krown/gw2raidar-app
#   ghcr.io/abraxas-krown/gw2raidar-frontend
# Tags: the branch name (feature/foo -> feature-foo), sha-<short commit>, and `latest` for develop.
# A release tag (git tag v3.2.0) gives `3.2.0` and `3.2`.
# Nothing here deploys; Dokploy is unaffected.
name: Docker images

on:
  push:
    branches: ["develop", "feature/**"]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]   # not applied to tag pushes
  workflow_dispatch:

# A newer push to the same branch cancels the build still running for the older one
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [app, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.target }}
          # `latest` always means develop, never the newest release tag
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/develop' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache kept in GitHub Actions, one per target; branches also read develop's
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max
