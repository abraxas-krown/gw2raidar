# The images are built by GitHub Actions (.github/workflows/docker.yml) and pulled from GHCR; IMAGE_TAG
# picks which build runs (see "Images" in DEPLOY.md). docker-compose.override.yml builds them locally instead.
services:
  db:
    # A new major version cannot read the data directory of an older one, so each gets its own
    # volume. Moving the data across is a manual step: see "Upgrading PostgreSQL" in DEPLOY.md.
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: gw2raidar
      POSTGRES_USER: gw2raidar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata17:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gw2raidar -d gw2raidar"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s

  # The site's entry point: Traefik (Dokploy) sends the domain's traffic to this service, port 80. It serves
  # the frontend (frontend/: the page shell and /assets/), and passes the API and the rest to `web` (docker/nginx.conf).
  frontend:
    image: ghcr.io/abraxas-krown/gw2raidar-frontend:${IMAGE_TAG:-latest}
    pull_policy: always   # tags like `latest` move, so fetch the current image on every deploy
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      web:
        condition: service_started
    # the page shell answers, so nginx is up and the image has it
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Django: the JSON API, downloads and the admin; only reachable through `frontend`
  web:
    image: ghcr.io/abraxas-krown/gw2raidar-app:${IMAGE_TAG:-latest}
    pull_policy: always   # tags like `latest` move, so fetch the current image on every deploy
    restart: unless-stopped
    command: ["web"]
    depends_on:
      db:
        condition: service_healthy
    environment: &appenv
      # read by gw2raidar/settings.py
      DJANGO_DEBUG: "false"
      DJANGO_HTTPS: "true"
      DJANGO_CONSOLE_EMAIL: "true"   # print emails to the log unless EMAIL_HOST is set
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?set ALLOWED_HOSTS}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      UPLOAD_DIR: /data/uploads
      REPORT_DIR: /data/reports
      MIN_FREE_DISK_GB: ${MIN_FREE_DISK_GB:-}   # restat prunes old logs below this; 0 keeps all (default 10)
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
    expose:
      - "8000"
    volumes:
      - uploads:/data/uploads
      - reports:/data/reports
    # Healthy once migrations have run and the app answers (Host header must be an allowed host)
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request as u; h = os.environ['ALLOWED_HOSTS'].split(',')[0].strip(); u.urlopen(u.Request('http://127.0.0.1:8000/initial.json', headers={'Host': h, 'User-Agent': 'healthcheck'}), timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
      start_interval: 5s

  worker:
    image: ghcr.io/abraxas-krown/gw2raidar-app:${IMAGE_TAG:-latest}
    pull_policy: always   # tags like `latest` move, so fetch the current image on every deploy
    restart: unless-stopped
    command: ["worker"]
    depends_on:
      web:
        condition: service_healthy
    environment: *appenv
    volumes:
      - uploads:/data/uploads
      - reports:/data/reports

volumes:
  pgdata17:
  uploads:
  reports:
