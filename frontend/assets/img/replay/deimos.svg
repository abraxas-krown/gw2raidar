<circle class="fill-base stroke-deep" stroke-width="14" cx="338" cy="657" r="326"/>
<path class="fill-none stroke-strong" stroke-width="16" stroke-linecap="round" stroke-dasharray="14 62" d="M135.5 428.2A319 319 0 0 0 640.5 573.5"/>
<g class="fill-accent"><circle cx="357" cy="324" r="9"/><circle cx="8" cy="638" r="9"/><circle cx="676" cy="661" r="9"/><circle cx="329" cy="990" r="9"/></g>
