# Local use only: `docker compose` reads this file automatically next to docker-compose.yml, and it builds
# the images from this checkout instead of pulling them from GHCR. Dokploy reads only docker-compose.yml.
services:
  frontend:
    build:
      context: .
      target: frontend
    pull_policy: build

  # The new frontend (frontend-next/), next to `frontend` and against the same `web`; only with
  # `docker compose --profile next up --build`, at http://localhost:8081. Not in docker-compose.yml (Dokploy).
  frontend-next:
    profiles: [next]
    build:
      context: .
      target: frontend-next
    pull_policy: build
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      web:
        condition: service_started

  web:
    build:
      context: .
      target: app
      args:
        - GW2EI_TAG   # passed on only when set in the shell or .env; else the Dockerfile's pin
    pull_policy: build

  worker:
    build:
      context: .
      target: app
      args:
        - GW2EI_TAG   # passed on only when set in the shell or .env; else the Dockerfile's pin
    pull_policy: build
